name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Compile + unit tests
        run: npm test

      - name: Refund-hook Worker tests
        run: npm run test:worker

      - name: End-to-end (real VS Code, fixture workspace, webview must respond)
        run: xvfb-run -a npm run test:e2e

      - name: Audit shipped dependencies
        run: npm audit --omit=dev

      - name: Package VSIX
        run: npx @vscode/vsce package --out sendtoai.vsix

      - name: List VSIX contents (catches leaked files)
        run: npx @vscode/vsce ls

      - uses: actions/upload-artifact@v4
        with:
          name: sendtoai-vsix
          path: sendtoai.vsix
          retention-days: 14
